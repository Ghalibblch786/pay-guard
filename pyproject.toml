[project]
name = "pay-guard"
version = "0.1.0"
description = "PayGuard take-home: fraud detection prototype, LLM complaint triage prototype, production memo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "xgboost",
    "matplotlib",
    "pydantic>=2",
    "pyyaml",
    "python-dotenv",
    "google-genai",
    "pytest",
    "spacy>=3.8,<3.9",
    # local NER model for the Part B sanitizer; wheel SHA-256 1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
